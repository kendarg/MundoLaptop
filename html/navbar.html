<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Css/dark.css">
    <link rel="stylesheet" href="/Css/Nosotros.css">
    <link rel="stylesheet" href="/Css/navbar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/Css/login.css">
    <title>navbar</title>
</head>

<body>
    <!--navbar Ronal-->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid ">
            <a href="/inicio.html">
                <img src="/img/LOGO , PNG.png" alt="LOGO" class="logoimg">
            </a>
            <button class="navbar-toggler " type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown " aria-expanded="false" aria-label="Toggle navigation ">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item" class="libar">
                        <a class="nav-link " aria-current="page" href="/index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contactos</a>
                    </li>
                    </li>
                </ul>
                <div class="iconos-navbar ">
                    <a href="#" class="iconos"> <i class="bi bi-search iconos"></i> </a>
                    <a href="#" id="buttonuser" class="iconos"> <i class="bi bi-person iconos"></i> </a>
                    <a href="#" class="iconos"> <i class="bi bi-cart3 iconos"></i> </a>
                    <!-- Boton vision -->
                    <div class="btn iconos" id="modo">
                        <i class="bi bi-moon iconos" id="icono"></i>
                    </div>
                </div>
            </div>
    </nav>
    <!--contenedor main de cada pagina que debemos mostrar-->
    <!-- section para el login rhonald -->
    <section class="loginpg">
        <div id="overlay" class="overlay"></div>
        <aside id="loginPanel" class="login-panel">
            <button id="closeLogin" class="cerrar">
                <i class="bi bi-x-circle-fill"></i>
            </button>
            <div class="login-logo">
                <img src="/img/adad.png" alt="Mundo Laptop">
            </div>
            <h2>Iniciar sesión</h2>
            <p class="subtitulo">Bienvenido nuevamente.</p>
            <div class="grupo-input">
                <i class="bi bi-envelope"></i>
                <input type="email" placeholder="Correo electrónico">
            </div>
            <div class="grupo-input">
                <i class="bi bi-lock"></i>
                <input type="password" placeholder="Contraseña">
            </div>
            <a href="#" class="olvido">
                ¿Olvidaste tu contraseña?
            </a>
            <button class="buttonlogin">
                Iniciar sesión
            </button>
            <div class="linea">
                <span>o</span>
            </div>
            <button class="crearCuentaB">
                <i></i>
                ¿No tienes cuenta? Crear cuenta
            </button>
        </aside>
        <!-- formulario para crear cuenta ronal-->
        <div id="registroModal" class="registro-overlay">
            <div class="registro grupo-input">
                <button id="cerrarRegistro" class="cerrar-registro">
                    <i class="bi bi-x-circle-fill"></i>
                </button>
                <h2 class="tituloformulario">Crear cuenta</h2>
                <h3 class="subtituloformulario">hola! ingresa tus datos.</h3>
                <div class="grupo-input">
                    <i class="bi bi-person"></i>
                    <input type="email" placeholder="Nombre de usuario">
                </div>
                <div class="grupo-input">
                    <i class="bi bi-envelope"></i>
                    <input type="email" placeholder="Correo electrónico">
                </div>
                <div class="grupo-input">
                    <i class="bi bi-lock"></i>
                    <input type="password" placeholder="Contraseña">
                </div>
                <button class="buttonlogin">
                    Registrarse
                </button>
            </div>
        </div>
    </section>
    <!-- Foter Serguio -->
    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/Js/cambiDeVsion.js"></script>
    <script src="/Js/loginuser.js"></script>
    <script src="/Js/navbar.js"></script>
</body>

</html>
