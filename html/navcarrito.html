    <!-- Offcanvas Carrito -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito" aria-labelledby="offcanvasCarritoLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="offcanvasCarritoLabel">
                <i class="bi bi-cart3 me-2"></i>Tu Carrito
            </h5>
            <span id="cart-item-count" class="cart-item-count-badge">0 productos</span>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="offcanvas-body d-flex flex-column">
            <div id="cart-items" class="flex-grow-1 overflow-auto mb-3"></div>
            <div class="cart-summary border-top pt-3 mt-auto">
                <div class="mb-3">
                    <label for="tipo-envio-offcanvas" class="form-label font-sm fw-semibold mb-1">
                        <i class="bi bi-truck me-1"></i>Opciones de Envío
                    </label>
                    <select id="tipo-envio-offcanvas" class="tipo-envio form-select form-select-sm">
                        <option value="0" selected>Bogotá (Gratis)</option>
                        <option value="300000">Fuera de Bogotá ($300.000)</option>
                        <option value="2000000">Fuera del país ($2,000.000)</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2 text-muted">
                    <span>Costo de envío</span>
                    <span class="cart-shipping-cost fw-semibold text-success">Gratis</span>
                </div>
                <hr class="my-2">
                <div class="d-flex justify-content-between align-items-center fs-2 fw-bold mb-4">
                    <span>Total</span>
                    <span class="cart-total cart-accent-text">$0</span>
                </div>

                <button id="btn-proceder-pago-offcanvas" class="btn-checkout-main w-100 py-2 mb-2 fw-semibold">
                    <i class="bi bi-lock-fill"></i> Proceder al pago
                </button>
                <button class="btn-continue-shopping w-100 py-2 fw-semibold" data-bs-dismiss="offcanvas">
                    <i class="bi bi-arrow-left"></i> Seguir comprando
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div class="modal fade" id="modalCheckout" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Finalizar compra</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-checkout">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="nombreCliente" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" id="correoCliente" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" id="direccionCliente" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="metodoPago" class="form-label">Método de pago</label>
                            <select id="metodoPago" class="form-select form-select-sm" required>
                                <option value="" selected disabled>Selecciona un método</option>
                                <option value="mastercard">Mastercard</option>
                                <option value="amex">American Express</option>
                            </select>
                        </div>
                        <div class="alert alert-light">
                            Total a pagar: <strong id="checkout-total-price">$ 0</strong>
                        </div>
                        <button type="submit" class="btn-confirmar-compra w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-lock-fill"></i> Confirmar compra
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Panel de Login / Registro -->
    <section class="loginpg">
        <div id="overlay" class="overlay"></div>
        <aside id="loginPanel" class="login-panel">
            <button id="closeLogin" class="cerrar" type="button">
                <i class="bi bi-x-lg"></i>
            </button>
            <div class="login-logo">
                <img src="../img/adad.png" alt="Mundo Laptop">
            </div>

            <h2 id="panelTitle">Iniciar sesión</h2>
            <p id="panelSub" class="subtitulo">Bienvenido nuevamente.</p>

            <form id="authForm">
                <div class="grupo-input campo-registro" style="display: none;">
                    <i class="bi bi-person"></i>
                    <input type="text" id="nombreInput" placeholder="Nombre" autocomplete="name">
                </div>
                <div class="grupo-input campo-registro" style="display: none;">
                    <i class="bi bi-telephone"></i>
                    <input type="number" id="numeroInput" placeholder="Número de teléfono" autocomplete="tel">
                </div>
                <div class="grupo-input">
                    <i class="bi bi-envelope"></i>
                    <input type="email" id="emailInput" placeholder="Correo electrónico" autocomplete="email">
                </div>
                
            <div class="grupo-input position-relative">
                    <i class="bi bi-lock"></i>
                <input type="password" id="passwordInput" placeholder="Contraseña" autocomplete="current-password">
                <button type="button" class="btn-toggle-password" id="togglePasswordBtn" tabindex="-1">
                <i class="bi bi-eye" id="togglePasswordIcon"></i>
                </button>
            </div>

            <div class="grupo-input campo-registro position-relative" style="display: none;">
                <i class="bi bi-lock"></i>
                <input type="password" id="confirmPasswordInput" placeholder="Confirmar Contraseña" autocomplete="new-password">
                <button type="button" class="btn-toggle-password" id="toggleConfirmPasswordBtn" tabindex="-1">
                    <i class="bi bi-eye" id="toggleConfirmPasswordIcon"></i>
                </button>
            </div>

                <p id="statusMsg" style="font-size: 14px; display: none; margin-top: 8px; font-weight: 500;"></p>

                <button type="submit" id="loginBtn" class="buttonlogin">Iniciar sesión</button>
            </form>

            <div class="linea"><span>o</span></div>

            <button type="button" id="toggleModeBtn" class="google">
                ¿No tienes cuenta? Crear cuenta
            </button>
        </aside>
    </section>
