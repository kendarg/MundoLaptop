        </div>

        <!--Tareas -->
        <div class="col">
            <div class="p-4">
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Serie</th>
                                <th>Categoría</th>
                                <th>Marca</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Referencia</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="tareas">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!--Formulario--> <!-- div para agregar Producto -->
        <div id="modalProducto" class="modal-producto">
            <div class="modal-contenido">
                <form class="p-3 border rounded formulario">
                    <div class="cabeceraFormulario">
                        <h3>Agregar Producto</h3>
                        <button type="button" id="cerrarFormulario">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                    <div class="mb-10">
                        <label for="nombreProducto" class="form-label">
                            Nombre del Producto
                        </label>
                        <input type="text" class="form-control" id="nombreProducto" placeholder="Nombre del Producto">
                    </div>
                    <div class="mb-3">
                        <label for="numeroSerie" class="form-label">
                            Numero de serie
                        </label>
                        <input type="text" class="form-control" id="numeroSerie" placeholder="numeroSerie">
                    </div>
                    <div class="mb-3">
                        <label for="Categoria" class="form-label" id="importanciatxt">
                            Categoria
                        </label>
                        <select class="form-select" id="Categoria">
                            <option selected>Seleccionar...</option>
                            <option value="Nuevos">Nuevos</option>
                            <option value="Open Box">Open Box</option>
                            <option value="Usados">Usados</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="marca" class="form-label" id="importanciatxt">
                            Marca
                        </label>
                        <select class="form-select" id="marca">
                            <option selected>Seleccionar...</option>
                            <option value="Lenovo">Lenovo</option>
                            <option value="HP">HP</option>
                            <option value="Otras">Otras</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="Precio" class="form-label">
                            Precio
                        </label>
                        <input type="number" class="form-control" id="Precio">
                    </div>
                    <div class="mb-3">
                        <label for="Stock" class="form-label">
                            Stock
                        </label>
                        <input type="number" class="form-control" id="Stock">
                    </div>
                    <div class="mb-3">
                        <label for="referencia" class="form-label" id="importanciatxt">
                            Referencia
                        </label>
                        <select class="form-select" id="referencia">
                            <option selected>Seleccionar...</option>
                            <option value="Lenovo">Lenovo</option>
                            <option value="HP">HP</option>
                            <option value="Otras">Otras</option>
                        </select>
                    </div>
                    <hr>
                    <button type="button" class="btn btn-primary w-100">
                        Agragar Imagen
                    </button>
                    <hr>
                    <button type="submit" class="btn btn-primary w-100">
                        Agregar
                    </button>
                </form>
            </div>
        </div>

        <!-- JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
